<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>人类思维逻辑验收</title>
<style>
body{font-family:monospace;padding:16px;background:#111;color:#ddd;font-size:13px}
pre{white-space:pre-wrap;line-height:1.6}
iframe{width:1500px;height:900px;border:0;position:absolute;left:-9999px}
h2{color:#8fd;font-size:14px;margin:18px 0 6px}
</style>
</head>
<body>
<pre id="out">running…</pre>
<iframe id="f" src="/index.html?intro=0"></iframe>
<script type="module">
/* =========================================================
   人类思维逻辑验收（human-logic）
   ---------------------------------------------------------
   目的：不看「代码怎么写的」，只看「玩家会怎么想」。
   每条断言对应一个「人类对桌游的常识预期」，违反即 FAIL。
   例如：一块地能种 3 片，我种 1 片也应该能收获 —— 而不是
   「必须种满 3 片才给我收获按钮」。
   ========================================================= */
const lines=[];const out=document.getElementById('out');
const say=s=>{lines.push(s);out.textContent=lines.join('\n');};
let fails=0;
const check=(n,c,x='')=>{if(!c)fails++;say(`${c?'PASS':'FAIL'}  ${n}${x?'  → '+x:''}`);};

await new Promise(r=>{
  let n=0;
  const t=setInterval(()=>{
    const w=f.contentWindow;
    if(w && w.__game && w.__game.state){clearInterval(t);r();}
    else if(++n>120){clearInterval(t);r();}
  },150);
});
const w=f.contentWindow, d=w.document;
if(!w.__game){ say('FAIL 页面未初始化 __game'); say('\n=== 结果：1 项失败 ✗ ==='); }
else {
/* 隔离脏状态 */
w.localStorage.removeItem('cnvillage.seat.v1');
w.localStorage.setItem('cnvillage.mode.v1','local');
w.__game.setSeat(0); w.__game.setMode('local');
w.__game.debug.setWinMoney(260);
w.__game.debug.setFastMode(true);

const eng = await import('/src/engine.js');
const data = await import('/src/data.js');
/* newGame() 会换掉 state 对象，所以 G 必须每次重新取（不能用 const 捕获一次） */
let G = w.__game.state;
const st = () => w.__game.state;
const P = () => w.__game.state.players[0];
const reset = (money = 150) => {
  w.__game.newGame(); w.__game.setMode('local'); w.__game.setSeat(0);
  G = w.__game.state; P().money = money; w.__game.debug.setActor(0);
};

/* 找一块 3 片地（高肥力） */
const hiSoil = data.LANDS.find(l=>l.fertility==='高');
const hiIdx = data.TRACK.findIndex(c=>c.kind==='land' && c.soilId===hiSoil.id);

/* 面板操作框/弹层一律先关上，避免干扰 */
const closeAll = () => { const c=d.getElementById('modal-close'); if(c) c.click(); };

say('=== A. 种植 / 收获（人类常识：种了就能收，不必种满）===');
if (hiIdx < 0) { check('赛道上有高肥力土地可供测试', false, '未找到'); }
else {
  /* 干净开局 */
  w.__game.newGame(); w.__game.setMode('local'); w.__game.setSeat(0);
  w.__game.debug.giveLand(0, hiIdx);
  P().pos = hiIdx;                       // 站在自己的地上（新规则：只能站脚下种）
  P().seeds = { shuidao: 3 };            // 手里有 3 张水稻种子
  w.__game.debug.setActor(0);            // 面板主人 = 座位 0

  /* 种 1 片（高肥力地上限 3 片，故意只种 1 片） */
  const pr = eng.plant(G, P(), hiIdx, 'shuidao', 1);
  w.__game.debug.render();
  check('A0 成功种下 1 片（未满）', pr.ok === true && P().lands[hiIdx].crops.length === 1,
    pr.ok ? `已种 ${P().lands[hiIdx].crops.length} 片 / 上限 3 片` : ('种植失败：'+pr.msg));

  const farm = d.querySelector('#myfarms .farm');
  const harvestBtn = farm ? farm.querySelector('button.harvest') : null;
  check('A1 只种 1 片（未种满）也应出现「收获」按钮',
    !!harvestBtn,
    harvestBtn ? '有「收获」按钮' : '✖ 地块上只有「种植」按钮 —— 被迫种满才能收（违反常识）');

  /* 点击真实「收获」按钮，验证能拿到钱 */
  const m0 = P().money;
  if (harvestBtn) harvestBtn.click();
  await new Promise(r=>setTimeout(r,150));
  check('A2 点「收获」能拿到钱（> 0）', P().money > m0,
    `${m0} → ${P().money}`);
  check('A3 收获后该地作物清空', P().lands[hiIdx].crops.length === 0,
    `剩 ${P().lands[hiIdx].crops.length} 条记录`);

  /* 空地：不应出现「收获」按钮（没种的东西收不了） */
  w.__game.debug.render();
  const farm2 = d.querySelector('#myfarms .farm');
  check('A4 空地上不出现「收获」按钮',
    !farm2.querySelector('button.harvest'),
    '按钮：' + [...farm2.querySelectorAll('.fbtns button')].map(b => b.textContent.trim()).join(' / '));

  /* 本回合已收获的地块：不应还能再种（否则「种→收→再种」刷钱） */
  const plantBtn = [...farm2.querySelectorAll('.fbtns button')].find(b=>!b.classList.contains('harvest'));
  check('A5 本回合已收获的地块，「种植」按钮应禁用（并说明原因）',
    !!plantBtn && plantBtn.disabled === true,
    plantBtn ? `disabled=${plantBtn.disabled}` + (plantBtn.title?`，title「${plantBtn.title.split('\n')[0]}」`:'') : '无种植按钮');

  closeAll();
}

say('\n=== B. 买地 / 过路费（人类常识：钱够就能买、付了钱地就归我、钱不够买不了）===');
{
  /* 找一块**无主**土地（每次 reset() 都会重开一局，landOwners 清空） */
  const freeIdx = data.TRACK.findIndex((c, i) => c.kind === 'land' && !st().landOwners[i]);
  if (freeIdx < 0) { check('赛道上有无主土地可供测试', false, '未找到'); }
  else {
    const land = data.landById(data.TRACK[freeIdx].soilId);

    /* 把面板主人放到这块地上，并重画「落格操作」框，返回其中的按钮 */
    const onLand = (money) => {
      reset(money);
      const me = P();
      me.pos = freeIdx;
      w.__game.debug.setActor(0);
      return me;
    };
    const actBtns = () => {
      w.__game.debug.showActions('测试回合', w.__game.debug.postMoveActions());
      return [...d.querySelectorAll('#actions button.act')];
    };

    /* B1/B2：钱够 → 能买；买了 → 地归我、按地价扣钱 */
    let me = onLand(500);
    let btns = actBtns();
    const buyBtn = btns.find(b => /花 .* 肥力币购入/.test(b.textContent));
    check('B1 站在无主地、钱够 → 出现可用的「购入」按钮',
      !!buyBtn && !buyBtn.disabled, buyBtn ? ('disabled=' + buyBtn.disabled) : '无购入按钮');
    const m0 = me.money;
    if (buyBtn) buyBtn.click();
    await new Promise(r => setTimeout(r, 150));
    check('B2 点「购入」→ 地归自己、钱按地价减少',
      st().landOwners[freeIdx] === me.tid && me.money === m0 - land.price,
      `owner=${st().landOwners[freeIdx]}｜money ${m0}→${me.money}（地价 ${land.price}）`);

    /* B3：钱不够 → 「购入」按钮禁用 */
    me = onLand(land.price - 1);
    btns = actBtns();
    const buy3 = btns.find(b => /花 .* 肥力币购入/.test(b.textContent));
    check('B3 钱不够（差 1 币）→ 「购入」按钮禁用',
      !!buy3 && buy3.disabled === true, buy3 ? ('disabled=' + buy3.disabled) : '无购入按钮');

    /* B4/B5：免费买地卡 —— 钱不够也能用卡，钱不变、卡 −1 */
    me = onLand(0);
    me.freeLandCards = 1;
    btns = actBtns();
    const freeBtn = btns.find(b => /免费买地卡/.test(b.textContent));
    check('B4 有免费买地卡 → 出现「免费购入」按钮（且可用）',
      !!freeBtn && !freeBtn.disabled, freeBtn ? ('disabled=' + freeBtn.disabled) : '无免费按钮');
    const m4 = me.money;
    if (freeBtn) freeBtn.click();
    await new Promise(r => setTimeout(r, 150));
    check('B5 用免费卡购入 → 地归自己、钱不变、免费卡 −1',
      st().landOwners[freeIdx] === me.tid && me.money === m4 && me.freeLandCards === 0,
      `owner=${st().landOwners[freeIdx]}｜money ${m4}→${me.money}｜free=${me.freeLandCards}`);

    /* B6：过路费 —— 落在他人土地付 20%（四舍五入），转给地主 */
    reset(200);
    const me6 = P();
    w.__game.debug.giveLand(0, freeIdx);
    const other = st().players[1];
    other.pos = freeIdx;
    const fee = Math.round(land.price * data.RULES.passRate);
    const oM = other.money, ownerM = me6.money;
    eng.payPass(st(), other, freeIdx);
    check('B6 落在他人土地 → 付 20% 地价、转给地主',
      other.money === oM - fee && me6.money === ownerM + fee,
      `过路费 ${fee}｜付款方 ${oM}→${other.money}｜地主 ${ownerM}→${me6.money}`);

    /* B7：站在别人的地上 → 不该出现「购入」（地已有主） */
    reset(500);
    const me7 = P();
    w.__game.debug.giveLand(1, freeIdx);
    me7.pos = freeIdx;
    w.__game.debug.setActor(0);
    btns = actBtns();
    const buy7 = btns.find(b => /肥力币购入/.test(b.textContent));
    check('B7 站在他人地上 → 不出现「购入」按钮（已有人买走）',
      !buy7, buy7 ? ('✖ 仍显示：' + buy7.textContent.replace(/\s+/g, ' ').slice(0, 30)) : 'ok');

    /* B8：买地后同一回合就能在这块地上种植（人类常识：刚买下、就站在这地上） */
    reset(500);
    const me8 = P();
    me8.pos = freeIdx;
    w.__game.debug.setActor(0);
    eng.buyLand(st(), me8, freeIdx);
    btns = actBtns();
    const plant8 = btns.find(b => /种植作物/.test(b.textContent));
    check('B8 买地后同回合就能在此地种植',
      !!plant8, plant8 ? '有「种植作物」' : '✖ 买完地却点不到种植');
    closeAll();
  }
}

say('\n=== C. 气象卡方向（人类常识：灾害卡要扣钱，好天气才加钱）===');
{
  /* 在同一块地、同一作物上，分别「无气象 / 灾害 / 好天气」种 1 片，比单片利润 */
  const plantOne = (wxId) => {
    reset(200);
    const me = P();
    w.__game.debug.giveLand(0, hiIdx);
    me.pos = hiIdx;
    me.seeds = { shuidao: 3 };
    if (wxId) me.weatherCards = [wxId];
    w.__game.debug.setActor(0);
    eng.plant(st(), me, hiIdx, 'shuidao', 1);
    const c0 = me.lands[hiIdx].crops[0];
    return { profit: c0 ? c0.profit : null };
  };

  /* C0：数据自洽 —— 凡 sign<0 的气象卡，数值必须是负的 */
  const badOnes = data.WEATHERS.filter(w => w.sign < 0 && !(w.base < 0))
    .map(w => `${w.name}(${w.base})`);
  check('C0 灾害类气象卡（sign<0）的数值应为负',
    badOnes.length === 0, badOnes.length ? '✖ 仍为正：' + badOnes.join('、') : '全部为负');

  const base = plantOne(null).profit;
  const dis = plantOne('w3').profit;      // 台风过境（sign -1）
  const good = plantOne('w1').profit;     // 风调雨顺（sign +1）
  check('C1 抽到灾害卡（台风）后种植 → 该片利润低于无气象',
    base !== null && dis !== null && dis < base, `无气象 ${base} vs 台风 ${dis}`);
  check('C2 抽到好天气（风调雨顺）后种植 → 该片利润高于无气象',
    base !== null && good !== null && good > base, `无气象 ${base} vs 风调雨顺 ${good}`);

  /* C3：气象卡弹层要按实际方向显示（灾害显示负号，不能写 +25） */
  reset(200);
  P().weatherCards = ['w3'];
  w.__game.debug.setActor(0);
  w.__game.debug.openCardHub('weather');
  await new Promise(r => setTimeout(r, 120));
  const hubTxt = d.getElementById('modal-body').textContent;
  const shown = hubTxt.match(/[+\-]\s*\d+\s*肥力币/);
  check('C3 气象卡弹层：灾害卡的数值带负号（不是 +25）',
    !!shown && shown[0].indexOf('-') >= 0, shown ? ('显示 ' + shown[0].replace(/\s+/g, '')) : '未找到数值');
  closeAll();
}

say('\n=== D. 改良卡（人类常识：每张 +6% 累积、封顶 +48%、预估要等于实收）===');
{
  const actBtns2 = () => {
    w.__game.debug.showActions('测试回合', w.__game.debug.postMoveActions());
    return [...d.querySelectorAll('#actions button.act')];
  };

  reset(200);
  const me = P();
  check('D0 无改良卡 → 0% 增益', eng.improveBonus(me).rate === 0, eng.improveBonus(me).rate);
  me.hand = ['nongyao'];                          // 面值 20（最高）→ +6%
  check('D1 1 张（面值20）→ +6%', Math.abs(eng.improveBonus(me).rate - 0.06) < 1e-9, eng.improveBonus(me).rate);
  me.hand = ['dimo'];                             // 面值 5 → +1.5%
  check('D1b 1 张（面值5）→ +1.5%', Math.abs(eng.improveBonus(me).rate - 0.015) < 1e-9, eng.improveBonus(me).rate);
  me.hand = new Array(8).fill('nongyao');
  check('D2 面值20 ×8 → +48%', Math.abs(eng.improveBonus(me).rate - 0.48) < 1e-9, eng.improveBonus(me).rate);
  me.hand = new Array(11).fill('nongyao');
  check('D3 超过上限仍封顶 +48%', Math.abs(eng.improveBonus(me).rate - 0.48) < 1e-9, eng.improveBonus(me).rate);

  /* D4：操作框里「预计收获」必须等于实际到手的钱（含改良卡加成）——
     玩家是冲着那个数字去点「收获」的，估少了就是骗人。 */
  reset(200);
  const me4 = P();
  w.__game.debug.giveLand(0, hiIdx);
  me4.pos = hiIdx;
  me4.seeds = { shuidao: 3 };
  me4.hand = ['nongyao', 'nongyao', 'nongyao', 'nongyao'];   // 面值20 ×4 = 80/20 → +24%
  w.__game.debug.setActor(0);
  eng.plant(st(), me4, hiIdx, 'shuidao', 1);
  const bs = actBtns2();
  const hv = bs.find(b => /收获/.test(b.textContent));
  const est = hv ? Number((hv.textContent.match(/预计\s*([+\-]?\d+)/) || [])[1]) : NaN;
  const r = eng.harvest(st(), me4, hiIdx);
  check('D4 操作框「预计收获」= 实收（改良卡加成必须算进去）',
    Number.isFinite(est) && est === r.total, `预计 ${est} vs 实收 ${r.total}`);
  closeAll();
}

say('\n=== E. 破产 / 胜利（人类常识：出局的部落要一眼看出来；达到胜利线立刻结束）===');
{
  const RULES_WIN = data.RULES.winMoney;
  /* 直接让座位 0 欠款 60（> 上限 50）触发破产 */
  reset(200);
  const me = P();
  w.__game.debug.giveLand(0, hiIdx);
  me.money = -60;
  eng.checkBankrupt(st(), me);
  w.__game.debug.render();

  const card = [...d.querySelectorAll('#players .pcard')].find(c => /破产出局/.test(c.textContent));
  check('E0 破产部落卡片标注「破产出局」', !!card && card.classList.contains('bankrupt'),
    card ? card.className : '无破产卡片');
  check('E1 破产后名下土地回归无主',
    Object.keys(st().landOwners).length === 0 && Object.keys(me.lands).length === 0,
    `landOwners=${Object.keys(st().landOwners).length}｜lands=${Object.keys(me.lands).length}`);
  check('E2 破产部落金额标红（.debt）',
    !!card && !!card.querySelector('.pmoney.debt'),
    card ? card.querySelector('.pmoney').className : '—');

  /* E3：既然「出局」，棋子就不该还像在场的部落一样 —— 必须可辨识地打上出局标记 */
  const pw = d.querySelector('.pawn.' + me.tid);
  check('E3 破产部落的棋子被打上「出局」标记（.out）',
    !!pw && pw.classList.contains('out'), pw ? ('class=' + pw.className) : '无棋子节点');

  /* E4：达到胜利线 → 立刻结束、判该部落获胜 */
  reset(200);
  const me4 = P();
  me4.money = RULES_WIN + 40;            // 超过胜利线
  w.__game.debug.setActor(0);
  eng.stepEnd(st());
  check('E4 达到胜利线 → 本局结束且判该部落获胜',
    st().over === true && !!st().winner && st().winner.tid === me4.tid,
    `over=${st().over}｜winner=${st().winner ? st().winner.name : 'null'}`);
  closeAll();
}
say('\n=== F. 起点 / 监狱（人类常识：经过起点就加钱；只有「落在」监狱才坐牢）===');
{
  const START = data.TRACK.findIndex(c => c.kind === 'start');
  const JAIL = data.TRACK.findIndex(c => c.kind === 'jianyu');

  /* F0：经过起点（不停在上面）也加钱，且只加一次 */
  reset(100);
  let me = P();
  me.pos = (START - 2 + 32) % 32;                 // 距起点 2 格
  let m0 = me.money;
  eng.stepMove(st(), 4);                          // 走 4 步必然跨过起点
  check('F0 经过起点 → +50（且只加一次）',
    me.money === m0 + data.RULES.startBonus,
    `money ${m0}→${me.money}（应 +${data.RULES.startBonus}）`);

  /* F1：正好落在起点也加钱 */
  reset(100);
  me = P();
  me.pos = (START - 1 + 32) % 32;
  m0 = me.money;
  eng.stepMove(st(), 1);
  check('F1 正好落在起点 → 也 +50',
    me.money === m0 + data.RULES.startBonus, `money ${m0}→${me.money}`);

  /* F2：只是路过监狱，不坐牢 */
  reset(100);
  me = P();
  me.pos = (JAIL - 1 + 32) % 32;                  // 监狱前一格
  eng.stepMove(st(), 2);                          // 跨过监狱、落到下一格
  check('F2 路过监狱不坐牢（skipTurns 仍为 0）',
    (me.skipTurns || 0) === 0 && me.pos !== JAIL, `skipTurns=${me.skipTurns}｜pos=${me.pos}`);

  /* F3：落在监狱 → 下一回合被暂停 */
  reset(100);
  me = P();
  me.pos = (JAIL - 1 + 32) % 32;
  eng.stepMove(st(), 1);                          // 落到监狱
  check('F3 落在监狱 → 标记暂停（skipTurns = 1）',
    me.skipTurns === 1 && me.pos === JAIL, `skipTurns=${me.skipTurns}｜pos=${me.pos}`);
  /* 刚进监狱时，面板就该让玩家一眼看出「我在牢里」—— 这段窗口一直持续到
     服刑的那一回合被跳过（endTurn 换手后）为止。 */
  w.__game.debug.render();
  const jailCard = [...d.querySelectorAll('#players .pcard')][0];
  check('F3c 进监狱后面板显示「狱中」标签',
    !!jailCard.querySelector('.ptag.jail'), jailCard.querySelector('.pname').textContent.replace(/\s+/g,' '));
  let r = eng.stepRoll(st());                     // 下一回合（服刑）
  check('F3b 服刑的那一回合被跳过（stepRoll.skipped）', r.skipped === true, `skipped=${r.skipped}`);
  r = eng.stepRoll(st());                         // 再下一回合应恢复
  check('F3d 暂停一回合后恢复行动', r.skipped === false, `skipped=${r.skipped}`);

  /* F4：服刑的提示语不能自相矛盾（「暂停 0 回合后继续」这种） */
  const prisMsgs = st().log.filter(l => /监狱|服刑/.test(l.msg)).map(l => l.msg);
  const nonsense = prisMsgs.find(m => /暂停\s*0\s*回合/.test(m));
  check('F4 服刑提示不出现「暂停 0 回合」这类错话',
    !nonsense, nonsense || prisMsgs.join(' ｜ '));
  closeAll();
}

say('\n=== G. 气象卡消费时机（人类常识：种失败了不该白扔卡；成功才用掉一张）===');
{
  const setup = (opts = {}) => {
    reset(200);
    const me = P();
    w.__game.debug.giveLand(0, hiIdx);
    me.pos = hiIdx;
    me.weatherCards = opts.wx || ['w1'];
    me.seeds = opts.seeds || {};
    w.__game.debug.setActor(0);
    return me;
  };

  /* G0：没种子导致种植失败 → 延时气象卡不该被消耗 */
  let me = setup({ seeds: {} });
  let r = eng.plant(st(), me, hiIdx, 'shuidao', 1);
  check('G0 种植失败（没种子）→ 延时气象卡仍在手上',
    r.ok === false && (me.weatherCards || []).length === 1,
    `ok=${r.ok}｜待发卡 ${(me.weatherCards||[]).length} 张`);

  /* G1：种植成功 → 用掉一张（清零） */
  me = setup({ seeds: { shuidao: 3 } });
  r = eng.plant(st(), me, hiIdx, 'shuidao', 1);
  check('G1 种植成功 → 延时气象卡被消耗',
    r.ok === true && (me.weatherCards || []).length === 0,
    `ok=${r.ok}｜剩 ${(me.weatherCards||[]).length} 张`);

  /* G2：一次种 2 片，气象只作用在第一片（卡是一次性的） */
  me = setup({ seeds: { shuidao: 3 } });
  eng.plant(st(), me, hiIdx, 'shuidao', 2);
  const cs = me.lands[hiIdx].crops;
  check('G2 延时气象只作用在第一片（第二片不带气象）',
    cs.length === 2 && cs[0].weather === 'w1' && !cs[1].weather,
    `片1 ${cs[0] && cs[0].weather}｜片2 ${cs[1] && cs[1].weather}`);

  /* G3：手上有两张待发卡，一次种植只消耗一张 */
  me = setup({ wx: ['w1', 'w2'], seeds: { shuidao: 3 } });
  eng.plant(st(), me, hiIdx, 'shuidao', 1);
  check('G3 一次种植只消耗一张待发气象卡（其余留到下次）',
    me.weatherCards.length === 1 && me.weatherCards[0] === 'w2',
    `剩 [${me.weatherCards.join(',')}]`);
  closeAll();
}

say('\n=== Q. AI 长跑不变量（人类常识：电脑怎么打都不该把规则玩崩）===');
{
  reset(150);
  const bad = [];
  for (let i = 0; i < 400 && !st().over; i++) {
    eng.playTurn(st(), eng.aiDecide);
    for (const p of st().players) {
      if (!Number.isFinite(p.money)) bad.push(`${p.name} 钱非数字`);
      for (const [cid, n] of Object.entries(p.seeds || {})) {
        if (n < 0 || n > data.RULES.seedMaxPerType) bad.push(`${p.name} 种子 ${cid}=${n}`);
      }
      for (const k of Object.keys(p.lands || {})) {
        const idx = Number(k);
        if (!p.bankrupt && st().landOwners[idx] !== p.tid) {
          bad.push(`${p.name} 持有地 ${idx}，但归属表写的是 ${st().landOwners[idx]}`);
        }
        const rec = p.lands[k];
        const cap = data.plotsFor(data.landById(rec.soilId).fertility);
        if ((rec.crops || []).length > cap) bad.push(`${p.name}@${idx} 种了 ${rec.crops.length} 片 > 上限 ${cap}`);
        for (const cr of (rec.crops || [])) if (!Number.isFinite(cr.profit)) bad.push(`${p.name}@${idx} 作物收益非数字`);
      }
    }
    if (bad.length) break;
  }
  check('Q0 AI 长跑 400 回合：钱/种子/土地归属/作物数都不越界',
    bad.length === 0, bad.length ? '✖ ' + bad.slice(0, 5).join('；') : `跑到第 ${st().round} 轮，over=${st().over}`);
  /* 结束后若有人获胜，胜者必须是未破产的部落 */

      eng.plant(st(), me, landIdx, cropId, 1);

    };
    return run('w1') - run(null);
  };
  const sIdx = data.TRACK.findIndex(c => c.kind === 'land' && c.soilId === 'jiangnan');
  const yIdx = data.TRACK.findIndex(c => c.kind === 'land' && c.soilId === 'heilitu');

    `范围 ${Math.min(...pts)}~${Math.max(...pts)}（${pts.length} 次）`);
  closeAll();
}
say(`\n=== 结果：${fails===0?'全部通过 ✓':fails+' 项失败 ✗'} ===`);
}
