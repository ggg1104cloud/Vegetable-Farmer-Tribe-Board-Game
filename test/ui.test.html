<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>UI 流程验收</title>
<style>
body{font-family:monospace;padding:16px;background:#111;color:#ddd;font-size:13px}
pre{white-space:pre-wrap;line-height:1.6}
iframe{width:1500px;height:900px;border:0;position:absolute;left:-9999px}
</style>
</head>
<body>
<pre id="out">running…</pre>
<iframe id="f" src="/index.html?intro=0"></iframe>
<script type="module">
/* 顶层 await 的 IIFE 里，任何未捕获异常都会静默吞掉后面所有断言，
   表现为「某个章节标题打印了但一条 PASS 都没有」。挂两个捕获把原因打出来。 */
const lines=[];const out=document.getElementById('out');
const say=s=>{lines.push(s);out.textContent=lines.join('\n');};
let fails=0;
const check=(n,c,x='')=>{if(!c)fails++;say(`${c?'PASS':'FAIL'}  ${n}${x?'  → '+x:''}`);};

await new Promise(r=>{
  let n=0;
  const t=setInterval(()=>{
    const w=f.contentWindow;
    if(w && w.__game && w.__game.state){clearInterval(t);r();}
    else if(++n>120){clearInterval(t);r();}
  },150);
});

const w=f.contentWindow;
/* d 是 iframe 里的 document —— 全文件 40+ 处断言都用 d.xxx，
   这个简写必须留着。（曾被一次批量替换误删，导致后面章节全部抛
   "d is not defined" 而静默中断，只表现为「章节标题有、一条 PASS 没有」。）*/
const d=w.document;
/* 测试隔离：真人座位存在 localStorage（SEAT_KEY）。第30节会 setSeat(2) 且不还原，
   于是**重跑**时第10节拿到的默认座位不是 0，`!isAI(0)` 直接判成 false，
   连带「电脑追风」「交回真人」一起失败（都不是产品问题，是脏状态）。
   这里在跑任何断言前统一重置成默认：本地对战 + 真人座位 0。 */
w.localStorage.removeItem('cnvillage.seat.v1');
w.localStorage.setItem('cnvillage.mode.v1','local');
w.__game.setSeat(0);
w.__game.setMode('local');
/* 胜利线也存在 localStorage（上一轮 §8 可能把值改成 500 且不还原），
   重跑时 iframe 会在加载时就把它读进来。这里统一归位成默认 260，
   否则 §8 的「默认值 = 260」断言会误红。 */
w.__game.debug.setWinMoney(260);
/* 电脑调成快速模式：新规则下单机开局可能电脑先手（本局抽签顺序第一位），
   电脑默认一步停 3 秒，会让 §25/§29/§30 里「等真人回合」的用例空等几十秒。 */
w.__game.debug.setFastMode(true);
/* 收集 iframe 里的运行时异常：顶层 await 的模块里，异步回调（点击处理器、
   async 回合流程）抛出的异常不会冒泡到这里，只会静默把流程卡住。 */
const rtErrs=[];
w.addEventListener('error', e=>rtErrs.push('error: '+(e.message||e)));
w.addEventListener('unhandledrejection', e=>rtErrs.push('reject: '+((e.reason&&e.reason.message)||e.reason)));
if(!w.__game){ say('FAIL 页面未初始化 __game'); process(); }
const G=w.__game.state;

/* 固定以「本地对战」开局：模式存在 localStorage，上一轮跑完可能是 solo，
   会让面板主人（viewSeat）随机漂移，断言时有时无。
   ⚠️ 只切模式、不要 newGame —— newGame 会换掉 G，
   而下面 §3 等断言引用的都是这里最初捕获的 G。 */
w.__game.setMode('local');
/* 面板展示给谁 / 当前行动者是谁 —— 测试里取玩家一律走这两个，别用 G.turn */
const viewSeat=()=>w.__game.debug.viewSeat();
const panelP=()=>w.__game.state.players[viewSeat()];

/* 等「轮到某个真人座位」。
   新规则：单机模式开局不再强制真人先手 —— 本局抽签顺序第一位是谁就谁先行动
   （第一位是电脑就电脑先走）。所以下面几节凡是要「真人回合」的状态，
   **必须轮询等**，不能再用固定 setTimeout（之前人总是先手才碰巧能过）。
   先把电脑调成快速模式，一步从 3 秒压到 0.6 秒，避免无头虚拟时间下空等太久。 */
const waitHumanTurn = async (seat, tries = 350) => {
  for (let i = 0; i < tries; i++) {
    const s = w.__game.state;
    if (!w.__game.busy && s.order[s.turn] === seat && !w.__game.isAI(seat)) return true;
    await new Promise(r => setTimeout(r, 200));
  }
  return false;
};

say('=== 1. 初始渲染 ===');
check('赛道格 DOM 数量 = 32', document.querySelectorAll('#cells .cell').length===32||w.document.querySelectorAll('#cells .cell').length===32,
  w.document.querySelectorAll('#cells .cell').length+' 个');
check('玩家卡片 4 个', w.document.querySelectorAll('.pcard').length===4);
check('棋子 4 个', w.document.querySelectorAll('.pawn').length===4);
check('图板图片已加载', w.document.getElementById('board').naturalWidth>0,
  w.document.getElementById('board').naturalWidth+'px');

say('\n=== 2. 格子位置落在原图轨道上 ===');
const cells=[...w.document.querySelectorAll('.cell')];
const xs=cells.map(c=>parseFloat(c.style.left));
const ys=cells.map(c=>parseFloat(c.style.top));
check('全部格子有坐标', cells.every(c=>c.style.left&&c.style.top));
// 实测赛道环距边缘 7.7%~9.7%（PDF 图板外框较宽），阈值取 12%
check('格子分布在外圈（矩形贴边）',
  cells.every(c=>{
    const x0=parseFloat(c.style.left)/100, y0=parseFloat(c.style.top)/100;
    const x1=x0+parseFloat(c.style.width||'0')/100, y1=y0+parseFloat(c.style.height||'0')/100;
    return x0<0.17||x1>0.83||y0<0.20||y1>0.80;}),
  `x ${Math.min(...xs).toFixed(1)}~${Math.max(...xs).toFixed(1)}% / y ${Math.min(...ys).toFixed(1)}~${Math.max(...ys).toFixed(1)}%`);
check('格子为百分比锚定（0-100）', cells.every(c=>{
  const x=parseFloat(c.style.left),y=parseFloat(c.style.top);
  return x>=0&&x<=100&&y>=0&&y<=100;}),
  `${cells[0]?cells[0].style.left:'—'} / ${cells[0]?cells[0].style.top:'—'}`);
check('图板底图已按可用空间缩放',
  (()=>{const b=w.document.getElementById('board-wrap');
    return parseFloat(b.style.width)>100&&parseFloat(b.style.height)>100;})(),
  (()=>{const b=w.document.getElementById('board-wrap');
    return b.style.width+' × '+b.style.height;})());

say('\n=== 3. 掷骰流程（连跑 20 回合 + 种子路径采样）===');
// 无头环境 setTimeout 被虚拟时间压缩，busy 锁来不及释放，
// 改为直接驱动引擎逻辑（UI 侧交互在下方单独验证）
let err=0;
const eng = await import('/src/engine.js');
const g2 = w.__game.state;
try{
  for(let i=0;i<20 && !g2.over;i++){
    eng.playTurn(g2, eng.aiDecide);
    w.__game.newGame && null;
  }
}catch(e){err++; say('   异常: '+e.message);}
check('20 次掷骰无异常', err===0, `${err} 次错误`);
check('回合已推进', G.round>1, `第 ${G.round} 回合`);
check('有土地被购买', Object.keys(G.landOwners).length>0,
  `${Object.keys(G.landOwners).length} 块`);
/* 种子闭环由 §11（集市买卡真扣钱）与 §28（没有种子不能种）直接覆盖。
   这里只确认「随机走位的引擎能把作物种下去」这条路径可达 ——
   新规则「只能站在脚下的地种植」（见 §28）让「20 回合内必有一次种植」
   不再成立（实测约 16% 的整局一次都没种上），所以改成多局采样兜底。 */
let sawPlant = g2.log.some(l => l.msg.includes('种下'));
let sampleGames = 0;
for (let gi = 0; gi < 8 && !sawPlant; gi++) {
  sampleGames++;
  const stSample = eng.initGame(4);
  for (let i = 0; i < 200 && !stSample.over; i++) eng.playTurn(stSample, eng.aiDecide);
  if (stSample.log.some(l => l.msg.includes('种下'))) sawPlant = true;
}
check('随机走位下引擎能种下作物（种子流程通畅）', sawPlant,
  `首局 ${g2.log.filter(l=>l.msg.includes('种下')).length} 次种植 / 追加采样 ${sampleGames} 局`);
// 上面绕过了 UI 直接调引擎，DOM 日志不会增长；改验引擎日志
check('引擎日志有内容', G.log.length>5, G.log.length+' 条');
check('DOM 日志已渲染', w.document.querySelectorAll('.log .li').length>0,
  w.document.querySelectorAll('.log .li').length+' 条');
// 顺便验证 UI 掷骰按钮本身可用（只验证不重复）
const btn=w.document.getElementById('btn-roll');
check('掷骰按钮存在且类型正确', !!btn && btn.tagName==='BUTTON');

say('\n=== 4. 弹层交互 ===');
w.document.getElementById('btn-rules').click();
await new Promise(r=>setTimeout(r,120));
check('规则弹层打开', !w.document.getElementById('modal').hidden);
/* 2026-10-18：规则里的「⚠ 课程要解决的 4 个科学性 BUG」整段已按需求删除，
   这里改成断言「已删除」—— 锁住这个决定，别被谁又加回来。 */
check('规则内容已不含 4 个 BUG 段（2026-10-18 删除）',
  !w.document.getElementById('modal-body').innerHTML.includes('BUG'),
  w.document.getElementById('modal-body').innerHTML.includes('BUG')
    ? '仍含 BUG 字样' : '已移除');
check('规则核心机制仍在', /土地购买/.test(w.document.getElementById('modal-body').innerHTML)
  && /过路费/.test(w.document.getElementById('modal-body').innerHTML));
w.document.getElementById('modal-close').click();
await new Promise(r=>setTimeout(r,120));
check('规则弹层关闭', w.document.getElementById('modal').hidden);

say('\n=== 5. 点格子看详情 ===');
const landCell=cells.find(c=>/东北黑土|南方红壤|云贵黄壤|四川紫色土|江南水稻土|山东棕壤|黄绵土|荒漠土|西北沙土|海南砖红壤|青藏草甸土/.test(c.textContent));
check('存在土地格', !!landCell, landCell?landCell.textContent.trim().slice(0,20):'—');
landCell.click();
await new Promise(r=>setTimeout(r,150));
const mb=w.document.getElementById('modal-body').innerHTML;
check('土地详情弹层打开', !w.document.getElementById('modal').hidden);
check('详情含卡面图（SVG 现画）', mb.includes('data:image/svg+xml'), '弹层含内联卡面');
check('详情含作物收益表', mb.includes('净收益'));
w.document.getElementById('modal-close').click();

say('\n=== 6. 素材完整性 ===');
const imgs=[...w.document.querySelectorAll('img')];
const broken=imgs.filter(i=>i.complete && i.naturalWidth===0).map(i=>i.src);
check('无破图', broken.length===0, broken.slice(0,3).join(', '));
check('图板图加载正常', imgs.some(i=>i.naturalWidth>0),
  `${imgs.filter(i=>i.naturalWidth>0).length}/${imgs.length}`);
// 直接校验全部素材 URL 可访问
const urls=[
 'assets/board_map.png',
 'assets/cards/land_heilitu.png','assets/cards/land_nanfang.png',
 'assets/cards/crop_malingshu.png','assets/cards/crop_chashu.png',
 'assets/cards/imp_dimo.png','assets/cards/imp_nongyao.png',
 'assets/ui/tribe_A.png','assets/ui/station_nongji.png'
];
const chk=await Promise.all(urls.map(u=>new Promise(res=>{
  const im=new Image();
  im.onload=()=>res(true); im.onerror=()=>res(false);
  im.src='/'+u;
})));
check('全部关键素材可访问', chk.every(Boolean),
  `${chk.filter(Boolean).length}/${urls.length}`);

say('\n=== 7. 新游戏重置 ===');
w.__game.newGame();
await new Promise(r=>setTimeout(r,200));
check('重置后回合=1', w.__game.state.round===1);
check('重置后资金复原',
  w.__game.state.players.every(p=>p.money>=150));
check('重置后无土地', Object.keys(w.__game.state.landOwners).length===0);

say('\n=== 8. 对局设置与部落特长 ===');
w.document.getElementById('btn-settings').click();
await new Promise(r=>setTimeout(r,180));
check('设置弹层打开', !w.document.getElementById('modal').hidden);
const setInputs=[...w.document.querySelectorAll('#setlist input')];
check('4 个部落金额输入框', setInputs.length===4, setInputs.map(i=>i.value).join('/'));
const setHtml=w.document.getElementById('modal-body').innerHTML;
check('含四条部落特长', ['沃野中原','稻作之源','追风千里','丝路商队'].every(s=>setHtml.includes(s)));
// 背景音乐：元素在 + 循环 + 设置里有滑块、即时生效、持久化
const bgmEl=w.document.getElementById('bgm');
check('背景音乐元素存在且循环播放',
  !!bgmEl && bgmEl.loop===true && /bgm\.m4a/.test(bgmEl.getAttribute('src')||''),
  bgmEl ? (bgmEl.getAttribute('src')+' loop='+bgmEl.loop) : '无');
const volEl=w.document.getElementById('bgm-vol');
check('设置里有音量滑块', !!volEl && volEl.type==='range');
volEl.value='30';
volEl.dispatchEvent(new w.Event('input',{bubbles:true}));
await new Promise(r=>setTimeout(r,60));
check('拖滑块即时改音量', Math.abs(w.__game.debug.bgmEl.volume-0.3)<0.001,
  'volume='+w.__game.debug.bgmEl.volume);
check('音量百分比显示同步', w.document.getElementById('bgm-vol-txt').textContent==='30%',
  w.document.getElementById('bgm-vol-txt').textContent);
check('音量持久化到 localStorage',
  (w.localStorage.getItem('cnvillage.bgm.v2')||'').includes('0.3'),
  w.localStorage.getItem('cnvillage.bgm.v2')||'—');
// 0 音量必须「真静音」：只设 volume=0 在个别环境仍出音，所以 muted + pause 双保险
volEl.value='0';
volEl.dispatchEvent(new w.Event('input',{bubbles:true}));
await new Promise(r=>setTimeout(r,60));
const bg=w.__game.debug.bgmEl;
check('0 音量时真静音（muted + 暂停）',
  bg.muted===true && bg.volume===0 && bg.paused===true,
  `muted=${bg.muted} vol=${bg.volume} paused=${bg.paused}`);
check('0 音量时百分比显示 0%',
  w.document.getElementById('bgm-vol-txt').textContent==='0%',
  w.document.getElementById('bgm-vol-txt').textContent);
// 改 A 部落金额并应用（顺带设胜利线=500，一次「保存并重开」同时验证两项）
setInputs[0].value='210';
const winEl=w.document.getElementById('win-money');
check('设置里有胜利线输入框', !!winEl && winEl.type==='number',
  winEl ? ('value='+winEl.value) : '无');
check('胜利线默认值 = 260', !!winEl && Number(winEl.value)===260, winEl?winEl.value:'—');
w.document.getElementById('win-money').value='500';
w.document.getElementById('set-apply').click();
await new Promise(r=>setTimeout(r,450));
check('自定义金额生效', w.__game.state.players[0].money===210,
  'A = '+w.__game.state.players[0].money);
check('金额已持久化到 localStorage',
  (w.localStorage.getItem('cnvillage.startmoney.v1')||'').includes('210'),
  w.localStorage.getItem('cnvillage.startmoney.v1')||'—');
// 胜利线：设置弹层里可调「达到多少肥力币获胜」，保存后写入 RULES.winMoney + 持久化
check('自定义胜利线生效（RULES.winMoney）', w.__game.RULES.winMoney===500,
  'winMoney='+w.__game.RULES.winMoney);
check('胜利线同步到顶栏显示', w.document.getElementById('winline').textContent==='500',
  w.document.getElementById('winline').textContent);
check('胜利线持久化到 localStorage',
  (w.localStorage.getItem('cnvillage.winmoney.v1')||'')==='500',
  w.localStorage.getItem('cnvillage.winmoney.v1')||'—');
// 还原为默认 260（走调试入口，不再多开一局，避免影响后续时序）
w.__game.debug.setWinMoney(260);
check('胜利线可还原为默认 260', w.__game.RULES.winMoney===260,
  'winMoney='+w.__game.RULES.winMoney);
const traits=[...w.document.querySelectorAll('.pcard .ptrait')];
check('部落卡片显示特长标签', traits.length===4, traits.map(t=>t.textContent).join(' / '));
// 引擎带上了特长对象
const gtr=w.__game.state.players.map(p=>p.trait&&p.trait.name).join('/');
check('玩家对象挂上特长', gtr==='沃野中原/稻作之源/追风千里/丝路商队', gtr);

say('\n=== 9. 选种弹窗把加成算进收益 ===');
w.__game.newGame();
await new Promise(r=>setTimeout(r,300));
const dataMod = await import('/src/data.js');
const sd = dataMod.TRACK.findIndex(c=>c.kind==='land' && c.soilId==='shandong');
if (sd >= 0) {
  w.__game.debug.giveLand(0, sd);          // A 部落（沃野中原）拿一块山东棕壤
  await new Promise(r=>setTimeout(r,200));
  w.__game.debug.setActor(0);              // 面板主人 = A 部落（本地对战：viewSeat=curSeat）
  w.__game.state.players[0].pos = sd;      // 新规则：只能给「脚下」的地种植
  w.__game.debug.openPlantModal(sd);
  await new Promise(r=>setTimeout(r,220));
  const pm = w.document.getElementById('modal-body').innerHTML;
  const nBonus = (pm.match(/cc-bonus/g)||[]).length;
  check('加成标签已渲染', nBonus>0 && pm.includes('沃野中原'),
    `${nBonus} 个标签`);
  // 实际种下去再收获，账要对得上
  const st2 = w.__game.state;
  const p0 = st2.players[0];
  p0.money = 9999;
  p0.seeds = { yumi: 5 };          // 新规则：必须持有种子才能种
  const eng3 = await import('/src/engine.js');
  const rPlant = eng3.plant(st2, p0, sd, 'yumi');
  check('有种子时可以种下', rPlant.ok, rPlant.msg || '');
  check('种植消耗了一张种子', p0.seeds.yumi === 4, 'yumi=' + p0.seeds.yumi);
  const r3 = eng3.harvest(st2, p0, sd);
  check('结算含加成（100 → 190 量级）', r3.ok && r3.total > r3.raw,
    `原 ${r3.raw} → 实得 ${r3.total}`);
  w.document.getElementById('modal-close').click();
} else {
  check('赛道上有山东棕壤可供测试', false, '未找到');
}

say('\n=== 10. 单机模式 · 电脑追风 ===');
w.localStorage.setItem('cnvillage.mode.v1','solo');
w.__game.setMode('solo');
w.__game.newGame();
await new Promise(r=>setTimeout(r,400));
/* Bug1 修复后，开局可能直接就是电脑先手（order 第一位是电脑）——
   先等这条链跑完、操作权交回真人，再手动把回合交给座位 2，断言才可控。 */
for (let i = 0; i < 200 && w.__game.busy; i++) await new Promise(r=>setTimeout(r,200));
check('单机模式生效（B/C/D 为电脑）',
  w.__game.mode==='solo' && !w.__game.isAI(0) && w.__game.isAI(1) && w.__game.isAI(2),
  `mode=${w.__game.mode}`);
// 把回合交给「丝绸部落」（座位 2，特长=追风千里；单机下它是电脑），看它会不会追风。
// ⚠️ turn 是行动次序不是座位 —— 必须先在 order 里定位座位 2。
const gs = w.__game.state;
const turn0 = gs.turn;
gs.turn = gs.order.indexOf(2);
w.__game.debug.runAiTurn();
// 等电脑都走完、交回真人：当前行动者所在座位不再是电脑
let guardAi = 0;
while (w.__game.isAI(gs.order[gs.turn]) && !gs.over && guardAi++ < 900) {
  await new Promise(r=>setTimeout(r, 300));
}
const msgs = gs.log.map(l=>l.msg);
const zf = msgs.find(m=>m.includes('追风再投'));
check('电脑执行了追风再投', !!zf, zf ? zf.slice(0,44) : '未见追风日志');
// turn 会绕圈回到同一个下标，用「回合数变大」判断推进不可靠；
// 真正该验的是「电脑走完了、操作权交回真人」。
check('电脑回合完整走完（交回真人）',
  !w.__game.isAI(gs.order[gs.turn]) && gs.order[gs.turn] === 0,
  `turn=${gs.turn} actor=${gs.order[gs.turn]} round=${gs.round}`);

  const mbody = w.document.getElementById('modal-body');

  // 所有子元素都必须在视口内（之前测过把「元素左侧到右边界距离」误当左溢出）
  const VW = w.innerWidth;
  let worstOv = 0, worstTag = '';
  for (const el of mbody.querySelectorAll('*')) {
    const rr = el.getBoundingClientRect();
    const ov = Math.max(rr.right - VW, -rr.left);
    if (ov > worstOv) { worstOv = ov; worstTag = el.tagName.toLowerCase(); }
  }
  check('弹层内无子元素越界', worstOv <= 1, worstOv <= 1 ? '全部在视口内' : `溢出 ${worstOv.toFixed(0)}px ← ${worstTag}`);

  /* 成本标注有两种合法形态（新规则）：
       ① 有种子 → 种植不收钱，必须写明「消耗 N 张种子」（N = 本次片数），
          否则玩家以为自己被重复扣钱；
       ② 没种子 → 根本不能种，必须写明「无种子 · 不可种」并给出去处。 */
  const cap = grid ? grid.querySelector('figcaption').textContent.replace(/\s+/g,' ').trim() : '';
  check('选种卡标明本次成本（消耗种子 或 无种子不可种）',
    /消耗\s*\d+\s*张种子/.test(cap) || /无种子/.test(cap),
    cap.slice(0, 40));
  /* 片数选择器：肥力是**上限**不是指标，玩家自选 1~剩余空位（用户实测诉求）。
     山东棕壤 = 中肥力 = 容量 2 片，所以默认 2 片、可减到 1 片。 */
  const qbar = w.document.querySelector('#modal-body .qtybar');
  const qv = () => {
    const e = w.document.querySelector('#modal-body #qty-val');
    return e ? Number(e.textContent) : -1;
  };
  /* 取一张「种子够种满本次片数」的卡来验收益随片数变化：
     noseed / notenough 的卡展示的是**实际可种片数**（种子不够时就少种），
     不随 − / ＋ 改变，拿来测「按片计收益」会误报。 */
  const netTxt = () => {
    const f = [...w.document.querySelectorAll('#modal-body #croppick figure')]
      .find(x => !x.classList.contains('noseed') && !x.classList.contains('notenough'));
    return f ? f.textContent.replace(/\s+/g,' ') : '';
  };
  const netNum = () => Number((netTxt().match(/净\s*([+-]?\d+)/) || [])[1]);
  check('种植弹层有「片数选择器」（− / 数字 / ＋）',
    !!qbar && !!qbar.querySelector('#qty-minus') && !!qbar.querySelector('#qty-plus'),
    qbar ? qbar.textContent.replace(/\s+/g,' ').trim().slice(0, 40) : '无');
  const q1 = qv();
  check('片数默认 = 剩余空位（中肥力 → 2 片）', q1 === 2, `默认 ${q1} 片`);
  const n1 = netNum();
  w.document.querySelector('#modal-body #qty-minus').click();
  await new Promise(r=>setTimeout(r,150));
  const q2 = qv(), n2 = netNum();
  check('点「−」可少种一片（不强制种满）', q2 === 1, `${q1} → ${q2}`);
  check('卡片收益随片数下降（按片计）', n2 < n1, `${q1}片净${n1} → ${q2}片净${n2}`);
  w.document.querySelector('#modal-body #qty-plus').click();
  await new Promise(r=>setTimeout(r,150));
  const q3 = qv(), n3 = netNum();
  check('点「＋」可加回一片（不超过剩余空位）', q3 === 2, `${q2} → ${q3}`);
  check('收益随片数回升', n3 === n1, `${q2}片净${n2} → ${q3}片净${n3}`);
  check('「＋」到顶后禁用', w.document.querySelector('#modal-body #qty-plus').disabled === true,
    'disabled=' + w.document.querySelector('#modal-body #qty-plus').disabled);
  w.document.getElementById('modal-close').click();
  await new Promise(r=>setTimeout(r,250));
  // 加成标签必须独占一行（之前 display:inline-block 会和「净+95」挤同一行）
  w.__game.debug.openMarket();

  const mcl = w.document.getElementById('modal-close');
  if (mcl) mcl.click();
  await new Promise(r=>setTimeout(r,200));

        所以这里**一律读实际 display**，再据此判断该形态下应满足什么。
     这才是本节真正要守的不变量：不重叠、不越界、形态与 CSS 一致。 */
  const ah = d.getElementById('aihelper');
  const cs = w.getComputedStyle(ah);
  const sr = side.getBoundingClientRect();
  const ar = ah.getBoundingClientRect();
  const disp = cs.display;
  const sideCol = disp === 'flex';       // 右侧竖列（宽屏）
  const drawer  = disp === 'block';      // 底部抽屉（窄屏）
  check('AI 助手容器存在且形态合法（none/flex/block 三选一）',
    !!ah && ['none','flex','block'].includes(disp), `display=${disp}`);
  check('AI 竖列形态下位于日志列右侧（不重叠）',
    !sideCol || ar.left >= sr.right - 1,
    sideCol ? `AI左${Math.round(ar.left)} / 日志右${Math.round(sr.right)}` : `display=${disp}`);
  check('AI 抽屉形态下横贯底部（left=0 且铺满宽）',
    !drawer || (Math.abs(ar.left) <= 2 && ar.width >= w.innerWidth - 2),
    drawer ? `left=${Math.round(ar.left)} w=${Math.round(ar.width)} / vw=${w.innerWidth}`
            : `display=${disp}`);
  check('AI 列在视口内（右缘不越界）',
    disp === 'none' || ar.right <= w.innerWidth + 1,
    disp === 'none' ? '已收起'
      : `${Math.round(ar.left)}~${Math.round(ar.right)} / ${w.innerWidth}`);
}

 try {

  const bw = box.getBoundingClientRect();
  const st = d.getElementById('stage').getBoundingClientRect();

    bw.width <= 300 && bw.height <= 140,

say('\n=== 27. 赛道严格顺时针、无跳跃 ===');
{
 try {
  const TRACK = w.__game.TRACK;
  const posMod = await import('/src/cellPositions.js');
  const POS = posMod.CELL_POS;

  check('TRACK 与 CELL_POS 长度一致', TRACK.length === POS.length,
    TRACK.length + ' vs ' + POS.length);

  /* 邻接性：每步位移必须 < 0.30（实测正常 0.086~0.143，
     断裂时 0.855 —— 差8 倍）。这道断言专门拦「横穿图板」。 */
  const bad = [];
  let maxStep = 0;
  for (let i = 0; i < TRACK.length; i++) {
    const j = (i + 1) % TRACK.length;
    const dx = POS[j][0] - POS[i][0], dy = POS[j][1] - POS[i][1];
    const L = Math.hypot(dx, dy);
    maxStep = Math.max(maxStep, L);
    if (L > 0.30) bad.push(`${i}->${j}=${L.toFixed(3)}`);
  }
  check('每步位移都 ≤0.30（绝不横穿图板）', bad.length === 0,
    bad.length ? bad.join(', ') : '最大步长 ' + maxStep.toFixed(3));

  /* 顺时针：底边向左 / 左边向上 / 顶边向右 / 右边向下。
     判据= 方向序列里不能出现「反向」，转角恰好 4 次。 */
  const dirOf = (i, j) => {
    const dx = POS[j][0] - POS[i][0], dy = POS[j][1] - POS[i][1];
    return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'L' : 'R') : (dy < 0 ? 'U' : 'D');
  };
  const dirs = [];
  for (let i = 0; i < TRACK.length; i++) dirs.push(dirOf(i, (i + 1) % TRACK.length));
  const OPP = { L: 'R', R: 'L', U: 'D', D: 'U' };
  const folds = [];
  for (let i = 0; i < dirs.length; i++) {
    if (dirs[i] === OPP[dirs[(i - 1 + dirs.length) % dirs.length]]) {
      folds.push(`${(i - 1 + dirs.length) % dirs.length}->${i}->${(i + 1) % dirs.length}`);
    }
  }
  check('全程顺时针，无回头折返', folds.length === 0,
    folds.length ? folds.join(', ') : dirs.slice(0, 12).join(''));

  let turns = 0;
  for (let i = 0; i < dirs.length; i++) if (dirs[i] !== dirs[(i + 1) % dirs.length]) turns++;
  check('恰好 4 个转角', turns === 4, turns + ' 个');

  /* 四个转角的格子内容要与底图一致 */
  check('左下角（idx9）是种子集市，idx10 转入左边',
    TRACK[9].kind === 'zhongzi' && POS[9][0] < 0.10 && POS[10][0] < 0.10,
    `9=${TRACK[9].kind} (${POS[9][0].toFixed(3)},${POS[9][1].toFixed(3)}) / 10=(${POS[10][0].toFixed(3)},${POS[10][1].toFixed(3)})`);
  check('左上角（idx16）是监狱，紧接左边顶端',
    TRACK[16].kind === 'jianyu' && POS[15][0] < 0.10 && POS[16][0] < 0.10,
    `15=(${POS[15][0].toFixed(3)},${POS[15][1].toFixed(3)}) / 16=${TRACK[16].kind}`);
  check('右上角（idx25）是种子集市，紧接右边顶端',
    TRACK[25].kind === 'zhongzi' && POS[25][0] > 0.90 && POS[26][0] > 0.90,
    `25=${TRACK[25].kind} (${POS[25][0].toFixed(3)},${POS[25][1].toFixed(3)}) / 26=(${POS[26][0].toFixed(3)},${POS[26][1].toFixed(3)})`);

  /* 实际走一圈：位移后的落点必须逐格连续（引擎侧 stepMove 的 passed 数组） */
  const engTK = await import('/src/engine.js');
  const gTK = engTK.initGame(1);
  const pTK = gTK.players[0];
  pTK.pos = 8;                       // 底边中段
  const mv = engTK.stepMove(gTK, 4);// 跨过左下转角，走到左边
  check('跨转角行走时逐格经过每一格（4 步 = 4 个落点）',
    Array.isArray(mv.passed) && mv.passed.length === 4,
    'passed=' + JSON.stringify(mv.passed));
  const hops = mv.passed.map((idx, k) => {
    const prev = k === 0 ? 8 : mv.passed[k - 1];
    return Math.hypot(POS[idx][0] - POS[prev][0], POS[idx][1] - POS[prev][1]);
  });
  check('跨转角的每一步也是相邻格（无跳跃）',
    hops.every(L => L <= 0.30), '步长 ' + hops.map(x => x.toFixed(3)).join(' / '));
  pTK.pos = 0;
 } catch(err) { check('第26 节无异常', false, (err && err.message) || String(err)); }
}

say('\n=== 28. 没有种子就不能种（硬门槛）===');

 try {

    try { w.document.getElementById('modal-close').click(); } catch (e) {}

    delete st.players[0].lands[sd2];
    st.landOwners[sd2] = null;
  }

  st.landOwners[li] = null;

}

say('\n=== 30. 单机模式 · 追风 / 结束回合 修复回归 ===');
{
 try {
  /* 三个真实 bug（用户实测反馈）：
     ① 丝绸部落首回合：追风弹层的按钮被 busy 误禁用 → promise 永不 resolve，
        棋子不动、追风点不动。
     ② 落在站点格时动作框整个不弹（没有「结束回合」出口），看着像卡住。
     ③ 买地 / 种植 / 收获 / 弃卡后重画动作框时把「结束回合」按钮丢了。
     ⚠️ 无头环境虚拟时间会把 setTimeout 压缩，busy 锁与动画 sleep 会打架，
     所以这里**只断言状态与按钮**，不依赖「动画跑完」的时序（见文件头 §3 说明）。 */
  w.localStorage.setItem('cnvillage.mode.v1','solo');
  w.__game.setMode('solo');
  w.__game.setSeat(2);                       // 真人 = 丝绸部落（座位 2，有追风特长）
  w.__game.newGame();
  /* 新规则：开局按本局抽签顺序行动，可能电脑先手 —— 等轮到真人再测追风 */
  await waitHumanTurn(2);
  const gs3 = w.__game.state;
  const bx = () => {
    const b = d.getElementById('actionbox');
    const bs = [...d.querySelectorAll('#actions button')];
    return { hidden:b.hidden, hasEnd:bs.some(x=>/结束回合/.test(x.textContent)),
             allEnabled:bs.length>0 && bs.every(x=>!x.disabled), n:bs.length };
  };
  const waitIdle = async () => {
    for(let i=0;i<60;i++){ await new Promise(r=>setTimeout(r,300)); if(!w.__game.busy) return true; }
    return false;
  };

  check('单人模式真人=丝绸部落且轮到真人',
    gs3.order[gs3.turn]===2 && !w.__game.isAI(2), `actor=${gs3.order[gs3.turn]}`);
  check('回合开始不摆操作框（避免没有出口的旧操作）', bx().hidden===true);

  /* ① 掷骰 → 追风弹层必须出现且按钮可点（不 await doRoll，避免虚拟时间下悬挂） */
  w.__game.debug.doRoll();
  let zf=null;
  for(let i=0;i<40 && !zf;i++){
    await new Promise(r=>setTimeout(r,200));
    zf=[...d.querySelectorAll('#actions button')].find(b=>/追风/.test(b.textContent));
  }
  check('丝绸首回合弹出追风决策', !!zf,
    zf ? zf.textContent.replace(/\s+/g,' ').trim().slice(0,20) : '未弹出');
  check('追风按钮可点（busy 未误禁用）', !!zf && !zf.disabled,
    zf ? 'disabled='+zf.disabled : '—');
  /* 点「追风」：onClick 会同步扣掉追风机会 —— 用它证明按钮**真的可点**，
     而不只是 disabled=false（这是 bug ① 的核心：旧代码按钮灰着，点了没反应）。 */
  if(zf){
    const before = gs3.players[2].extraRollLeft;
    zf.click();
    check('点追风即时生效（按钮真的可点，流程未悬挂）',
      gs3.players[2].extraRollLeft === before - 1,
      `extraRollLeft ${before} → ${gs3.players[2].extraRollLeft}`);
  }
  await waitIdle();

  /* ② 站点格：没有任何操作，也必须给「结束回合」出口 */
  const TL3 = w.__game.TRACK;
  const stIdx = TL3.findIndex(c=>c.kind==='qixiang');
  gs3.players[2].pos = stIdx;
  const rawActs = w.__game.debug.landActions();
  const fullActs = w.__game.debug.postMoveActions();
  check('站点格确实没有可执行操作', rawActs.length===0, rawActs.length+' 条');
  check('站点格仍给「结束回合」出口',
    fullActs.some(a=>/结束回合/.test(a.label)), fullActs.map(a=>a.label).join(' / '));

  /* ③ 买地后重画动作框，不能把出口丢掉 */
  /* 电脑可能已在先手回合里买走第一块地（新规则：开局可能电脑先手），
     必须挑一块此刻仍无主的地，否则动作框里根本没有「购入」按钮。 */
  const li3 = TL3.findIndex((c,i)=>c.kind==='land' && !gs3.landOwners[i]);
  gs3.players[2].pos = li3;
  gs3.players[2].money = 600;
  w.__game.debug.setActor(2);                // 确保轮到真人（doRoll 后可能已换手）
  await waitIdle();
  await new Promise(r=>setTimeout(r,500));
  w.__game.debug.render();
  w.__game.debug.showActions('t', w.__game.debug.postMoveActions());
  const buyBtn = [...d.querySelectorAll('#actions button')]
    .find(b=>/购入/.test(b.textContent) && !b.disabled);
  check('轮到真人时空闲，买地按钮可用', !!buyBtn,
    buyBtn ? buyBtn.textContent.replace(/\s+/g,' ').trim().slice(0,18) : `busy=${w.__game.busy}`);
  if(buyBtn) buyBtn.click();
  /* 买地是异步流程（重画动作框 + 可能的动画）。固定 400ms 在无头虚拟时间下
     会偶发量到「刚被隐藏、还没重画出来」的中间态（正好违背本节开头的告诫：
     不依赖动画跑完的时序）。改成轮询等它现身，最多等 ~8s。 */
  for(let i=0;i<32 && bx().hidden;i++){ await new Promise(r=>setTimeout(r,250)); }
  check('买地后动作框仍含「结束回合」', bx().hasEnd && !bx().hidden,
    JSON.stringify(bx()));

  /* 还原成本地对战 + 真人座位 0，别污染后续用例与**下一次重跑** */
  gs3.over = false; gs3.winner = null;
  w.localStorage.setItem('cnvillage.mode.v1','local');
  w.localStorage.removeItem('cnvillage.seat.v1');
  w.__game.setSeat(0);
  w.__game.setMode('local');
  w.__game.newGame();
  await new Promise(r=>setTimeout(r,300));
 } catch(err){ check('第30 节无异常', false, (err && err.message) || String(err)); }
}

  const epoch0 = dbg.turnEpoch;
  check('newGame() 使回合纪元自增', epoch0 >= 1, `epoch=${epoch0}`);

  /* 等这局空闲（单机开局电脑可能先手，先等它走完交回真人） */
  let idle = false;
  for (let i = 0; i < 70; i++) {
    if (!w.__game.busy) { idle = true; break; }
    await new Promise(r => setTimeout(r, 200));
  }
  check('等到空闲，可发起一次「在飞的 AI 回合」', idle, `busy=${w.__game.busy}`);

  /* 让一个电脑座位开始行动，制造「在飞的旧协程」 */
  dbg.setActor(1);
  dbg.runAiTurn();
  await new Promise(r => setTimeout(r, 120));   // 停在第一个 await（睡 0.6s）里
  check('AI 回合已启动并在 await 中', w.__game.busy === true, `busy=${w.__game.busy}`);

  /* 关键：AI 协程「飞行中」重开一局，并切成**本地对战**。
     本地模式没有 AI —— 新一局不会自己跑回合，于是新一局的任何变化
     都只能来自那条未作废的旧协程（这正是原先的缺陷表现）。 */
  w.__game.setMode('local');
  w.__game.newGame();
  check('重开使纪元再 +1', dbg.turnEpoch === epoch0 + 1, `${epoch0} → ${dbg.turnEpoch}`);

  const gB = w.__game.state;
  const base = {
    turn: gB.turn, round: gB.round,
    logLines: d.getElementById('log').children.length
  };

  /* 等远超一个 AI 步长的时间（0.6s×4+）——旧协程若未作废，会继续
     对新一局 stepRoll / nextTurn / 写日志，把 gB 改乱 */
  await new Promise(r => setTimeout(r, 2600));

  check('旧 AI 协程未推进新一局的行动次序', w.__game.state.turn === base.turn,
    `turn ${base.turn} → ${w.__game.state.turn}`);
  check('旧 AI 协程未推进新一局的回合数', w.__game.state.round === base.round,
    `round ${base.round} → ${w.__game.state.round}`);
  check('旧 AI 协程未向新一局写日志',
    d.getElementById('log').children.length === base.logLines,
    `${base.logLines} → ${d.getElementById('log').children.length}`);
  check('新一局仍指向同一个状态对象（未被旧协程重开）', w.__game.state === gB);
  check('切到本地对战后新一局没有残留的 AI 在跑', w.__game.busy === false, `busy=${w.__game.busy}`);

  /* 收尾还原，别污染后续（以及下一次重跑） */
  w.__game.setSeat(0);
  w.__game.setMode('local');
  w.__game.newGame();
  await new Promise(r => setTimeout(r, 300));
 } catch(err){ check('第31 节无异常', false, (err && err.message) || String(err)); }
}

say('\n=== 32. 开局行动顺序弹窗（2026-10-18：顶栏常驻条 → 弹窗） ===');
{
 try{
  const dbg = w.__game.debug;
  const gate = d.getElementById('ordergate');
  const strip = d.getElementById('orderstrip');
  const okBtn = d.getElementById('order-ok');
  const orderBtn = d.getElementById('btn-order');

  check('存在顺序弹窗 #ordergate', !!gate);
  check('顺序条 #orderstrip 搬进弹窗但id 不变', !!strip && gate.contains(strip));
  check('顶栏顺序条已换成按钮 #btn-order', !!orderBtn
    && !d.querySelector('.round-info .order-strip'));
  /* ⚠️ 这条是本节最关键的回归锁：
     .ordergate 自带 display:flex（作者样式）会压过 UA 的 [hidden]{display:none}，
     漏写 [hidden] 规则时顺序窗会一直铺满全屏、把所有点击吃掉，
     而控制台一行错都没有。 */
  check('顺序窗 hidden 时真的不可见（[hidden]{display:none} 生效）',
    gate.hidden === true && getComputedStyle(gate).display === 'none',
    `hidden=${gate.hidden} display=${getComputedStyle(gate).display}`);

  w.__game.setMode('local');
  w.__game.newGame();                    // 无 gate：不该弹
  check('newGame()（不带 gate）不弹顺序窗', gate.hidden === true);

  dbg.showOrderGate(true);               // 模拟入场弹窗
  check('showOrderGate(true) 显示顺序窗', gate.hidden === false);
  const chips = [...strip.querySelectorAll('.os-chip')];
  check('顺序窗内 4 席', chips.length === 4, `chips=${chips.length}`);
  check('姓名顺序 = G.order',
    chips.map(c=>c.textContent.trim()).join('|')
      === w.__game.state.order.map(s=>w.__game.state.players[s].name).join('|'),
    chips.map(c=>c.textContent.trim()).join(' → '));
  check('每席标出「第 N 位」（且不污染 chip 文本）',
    strip.querySelectorAll('.og-cell').length === 4
      && strip.querySelectorAll('.og-pos').length === 4
      && /第 1 位/.test(strip.querySelector('.og-pos').textContent),
    [...strip.querySelectorAll('.og-pos')].map(x=>x.textContent.trim()).join(' '));
  check('确认按钮文案随 autoStart 变化',
    okBtn.textContent.indexOf('开始') >= 0, okBtn.textContent.trim());

  okBtn.click();
  check('点「知道了，开始」关闭顺序窗', gate.hidden === true);

  dbg.showOrderGate(false);
  check('手动查看模式按钮文案为「关闭」',
    okBtn.textContent.trim() === '关闭', okBtn.textContent.trim());
  okBtn.click();

  /* 收尾 */
  w.__game.setMode('local');
  w.__game.newGame();
  await new Promise(r => setTimeout(r, 250));
 } catch(err){ check('第32 节无异常', false, (err && err.message) || String(err)); }
}

say('\n=== 33. 游戏简介卷轴 + 封面底图（2026-10-18） ===');
{
 try{
  /* 这一节跑在「进主体之后」，卷轴与底图都不在开篇里，
     所以只能查 DOM 结构与 CSS 参数，查不了实际观感（要靠 shots/*.png）。 */
  const sc = d.getElementById('about-scroll');
  const bg = d.querySelector('.intro-mapbg');
  const veil = d.querySelector('.intro-mapveil');

  /* 卷轴：结构 */
  check('存在卷轴层 #about-scroll', !!sc);
  check('卷轴默认 hidden 且真的不可见（[hidden]{display:none} 生效）',
    !!sc && sc.hidden === true && getComputedStyle(sc).display === 'none',
    sc ? `hidden=${sc.hidden} display=${getComputedStyle(sc).display}` : '-');
  check('卷轴上下各有一根轴杆',
    sc.querySelectorAll('.scroll-rod').length === 2);
  /* 简介文字：三段，必须完整（用户给的文案） */
  const ps = [...sc.querySelectorAll('.scroll-body p')];
  check('简介三段齐全', ps.length === 3, `段数=${ps.length}`);
  const full = ps.map(p=>p.textContent).join('');
  check('简介含「种菜、农业改良、收获售卖」核心玩法',
    /种菜/.test(full) && /农业改良/.test(full) && /收获售卖/.test(full), full.slice(0, 30));
  check('简介含「类大富翁玩法」',
    /类大富翁玩法/.test(full));
  check('简介含「抢占肥沃土地 / 规划作物种植 / 收获蔬菜积累财富」',
    /抢占肥沃土地/.test(full) && /规划作物种植/.test(full)
    && /收获蔬菜积累财富/.test(full));
  check('简介含「轻松欢乐的农耕博弈…策略规划和财富增长的乐趣」',
    /轻松欢乐的农耕博弈/.test(full) && /策略规划和财富增长的乐趣/.test(full));
  check('卷轴标题为「游戏简介」', sc.querySelector('.scroll-title').textContent.trim() === '游戏简介');
  /* 动画：三段关键帧都在（开卷 / 文字淡入 / 收卷） */
  const css = Array.from(w.document.styleSheets)
    .flatMap(ss => { try { return Array.from(ss.cssRules).map(r=>r.cssText); }
                     catch(e){ return []; } }).join('\n');
  check('卷轴有开卷关键帧 scrollOpenPaper', /@keyframes\s+scrollOpenPaper/.test(css));
  check('卷轴有文字淡入关键帧 scrollInkIn', /@keyframes\s+scrollInkIn/.test(css));
  check('卷轴有收卷关键帧 scrollClosePaper', /@keyframes\s+scrollClosePaper/.test(css));

  /* 底图：结构 + 参数（原图1772×1200，此前压到 .17 糊成一团） */
  check('封面底图仍是那张水墨中国地图', !!bg
    && /board_map\.png$/.test(bg.getAttribute('src') || ''), bg ? bg.getAttribute('src') : '-');
  check('底图有一层独立的米色纱 .intro-mapveil', !!veil);
  const op = bg ? parseFloat(getComputedStyle(bg).opacity) : 0;
  check('底图不透明度已提高（≥0.3，原为 .17）', op >= 0.3, 'opacity=' + op);
  /* 底图与纱必须不吃点击，否则会挡住开篇的按钮 */
  check('底图 pointer-events:none（不吃点击）',
    !!bg && getComputedStyle(bg).pointerEvents === 'none');
  /* 宣纸柔化层：托住文字区，介于「看得清」与「不糊」之间 */
  const pw = d.querySelector('.intro-paperwash');
  check('有宣纸柔化层 .intro-paperwash', !!pw && getComputedStyle(pw).pointerEvents === 'none');
  /* ⚠️ 封面上的按钮/文字不许有透明底：它们压在米色地图底纹上，
     半透明色（var(--panel-hi) 之类）会把山峦透上来，看着像没上色。 */
  {
    const alphaOf = (el) => {
      const cs = w.getComputedStyle(el);
      const m = /rgba?\(([^)]+)\)/.exec(cs.backgroundColor);
      const p = m ? m[1].split(',') : [];
      return p.length > 3 ? parseFloat(p[3]) : 1;
    };
    const kbds = [...d.querySelectorAll('.intro-hint kbd')];
    check('提示条里的 kbd 全部不透明（alpha=1）',
      kbds.length === 4 && kbds.every(k => alphaOf(k) === 1),
      kbds.map(k => k.textContent + ':' + alphaOf(k)).join(' '));
    check('kbd 文字不透明（无 rgba 透明字色）',
      kbds.every(k => !/^rgba\(.*,\s*0?\.\d+\)$/.test(w.getComputedStyle(k).color)),
      kbds.length ? w.getComputedStyle(kbds[0]).color : '-');
  }

  /* 按钮组已挪到匾额正下方，且模式切换已从封面移除（2026-10-18） */
  check('封面已移除模式切换按钮 #intro-modes（入口统一到顶栏 #mode-seg）',
    !d.getElementById('intro-modes'));
  {
    const pl = d.querySelector('.intro-plaque').getBoundingClientRect();
    const go = d.querySelector('.intro-go').getBoundingClientRect();
    const sl = d.querySelector('.intro-slogans').getBoundingClientRect();
    check('按钮组在匾额下方、宣传语上方',
      go.top >= pl.bottom - 2 && sl.top >= go.bottom - 2,
      `匾额底${Math.round(pl.bottom)} 按钮${Math.round(go.top)}~${Math.round(go.bottom)} 标语顶${Math.round(sl.top)}`);
    check('按钮组水平居中（不偏左/右）',
      Math.abs((go.left + go.right) / 2 - (pl.left + pl.right) / 2) <= 4,
      `按钮中${Math.round((go.left+go.right)/2)} 匾额中${Math.round((pl.left+pl.right)/2)}`);
  }

  /* 行为：__intro.openAbout / closeAbout（页面此刻是主体，卷轴仍能开合） */
  w.__intro.openAbout();
  check('openAbout() 显示卷轴', sc.hidden === false
    && w.__intro.aboutOpen === true);
  check('打开后挂 opening 类（触发开卷动画）',
    sc.classList.contains('opening'), sc.className);
  w.__intro.closeAbout();
  check('closeAbout() 挂 closing 类（走收卷动画，不是直接消失）',
    sc.classList.contains('closing') && !sc.classList.contains('opening'), sc.className);
  check('closeAbout() 当帧还没 hidden（留时间放动画）', sc.hidden === false);
  await new Promise(r=>setTimeout(r,600));
  check('动画结束后卷轴真的 hidden 且清掉 class',
    sc.hidden === true && sc.className === 'scroll-layer', `hidden=${sc.hidden} cls="${sc.className}"`);
 } catch(err){ check('第33 节无异常', false, (err && err.message) || String(err)); }
}

say(`\n=== ${fails===0?'全部通过 ✓':fails+' 项失败 ✗'} ===`);
document.title = fails===0?'UITEST-OK':'UITEST-FAIL-'+fails;
function process(){ if(fails>0) throw new Error('fail'); }
</script>
